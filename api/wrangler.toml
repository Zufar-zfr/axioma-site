name = "axioma-chat"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Откуда разрешены запросы к чату. Через запятую. Когда подключите домен — добавьте его сюда.
ALLOWED_ORIGINS = "https://zufar-zfr.github.io"
# Модель Gemini: "gemini-2.5-flash" (качественнее) или "gemini-2.5-flash-lite" (дешевле и быстрее)
GEMINI_MODEL = "gemini-2.5-flash"

# Ключ GEMINI_API_KEY здесь НЕ пишем. Он задаётся командой:  npx wrangler secret put GEMINI_API_KEY
